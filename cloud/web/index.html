<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nungil look closer</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #5b5b5b; --line: #d9d9d9; --accent: #0b5cad; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #f0f0f0; --muted: #a8a8a8; --line: #3a3a3a; --accent: #6fb1ff; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, sans-serif; max-width: 640px; margin-inline: auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin-top: 0; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input, select, textarea, button { font: inherit; width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  button { background: var(--accent); color: #fff; border: 0; margin-top: 16px; min-height: 48px; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: wait; }
  #answer { margin-top: 20px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; min-height: 60px; white-space: pre-wrap; }
  #meta { color: var(--muted); font-size: 14px; }
  img#preview { max-width: 100%; margin-top: 10px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<h1>Nungil: look closer</h1>
<p class="lead">The cloud half of Nungil, an on-device scene assistant for blind users. The phone sends one frame
here when the user says "Eye, look closer". OpenCV 5 crops, sizes, lifts and reads any QR code; Amazon Bedrock
describes the view in two sentences. Nothing is stored.</p>
<form id="form">
  <label for="file">Photo (JPEG, up to 4 MB)</label>
  <input id="file" type="file" accept="image/jpeg,image/png" required>
  <img id="preview" alt="">
  <label for="question">Question</label>
  <input id="question" value="Describe what is in front of me.">
  <label for="lang">Language</label>
  <select id="lang"><option value="en">English</option><option value="ko">Korean</option></select>
  <label for="key">Access key (from the submission's testing notes)</label>
  <input id="key" type="password" autocomplete="off" required>
  <button id="ask" type="submit">Ask</button>
</form>
<div id="answer" aria-live="polite"></div>
<div id="meta"></div>
<script>
const form = document.getElementById('form');
const file = document.getElementById('file');
const preview = document.getElementById('preview');
const answer = document.getElementById('answer');
const meta = document.getElementById('meta');
const ask = document.getElementById('ask');
file.addEventListener('change', () => {
  const f = file.files[0];
  if (!f) { preview.style.display = 'none'; return; }
  preview.src = URL.createObjectURL(f);
  preview.style.display = 'block';
});
function toJpegBase64(f) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(f);
  });
}
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = file.files[0];
  if (!f) return;
  ask.disabled = true; answer.textContent = 'Looking closer…'; meta.textContent = '';
  try {
    const image = await toJpegBase64(f);
    const r = await fetch('./look', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-nungil-key': document.getElementById('key').value },
      body: JSON.stringify({ image, question: document.getElementById('question').value, lang: document.getElementById('lang').value })
    });
    const data = await r.json();
    if (!r.ok) { answer.textContent = 'Error ' + r.status + ': ' + (data.error || ''); return; }
    answer.textContent = data.answer;
    meta.textContent = (data.qr ? 'QR code: ' + data.qr + ' · ' : '') + data.ms + ' ms · ' + data.model;
  } catch (err) {
    answer.textContent = 'The cloud did not answer.';
  } finally {
    ask.disabled = false;
  }
});
</script>
</body>
</html>
